name: Test Application Packaging

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  win-pyinstaller:
    name: Build package on Windows (PyInstaller)
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Package application
        run: >
          pyinstaller
          -i resources/icons/icon.ico
          -n main
          -F
          --console
          --noconfirm
          --clean
          --noupx
          --log-level WARN
          --hidden-import=win32timezone
          --exclude-module=tkinter
          --exclude-module=turtle
          --exclude-module=unittest
          --exclude-module=pydoc
          --exclude-module=xml
          --exclude-module=xmlrpc
          --exclude-module=sqlite3
          --exclude-module=ftplib
          --exclude-module=imaplib
          --exclude-module=smtplib
          --exclude-module=poplib
          --exclude-module=telnetlib
          --exclude-module=nntplib
          --exclude-module=pdb
          --exclude-module=doctest
          --exclude-module=ensurepip
          --exclude-module=multiprocessing
          --exclude-module=lib2to3
          --exclude-module=test
          --exclude-module=idlelib
          src/projectjyn/main.py

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: win-pyinstaller
          path: dist/main.exe
          if-no-files-found: error

  win-nuitka:
    name: Build package on Windows (Nuitka)
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Package application
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/projectjyn/main.py
          output-dir: build
          mode: onefile
          msvc: latest
          windows-console-mode: force
          windows-icon-from-ico: resources/icons/icon.ico
          output-file: main.exe
          disable-cache: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: build/main.exe

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: win-nuitka
          path: build/main.exe
          if-no-files-found: error

  collect-artifacts:
    name: Collect test packages
    runs-on: ubuntu-latest

    needs:
      - win-pyinstaller
      - win-nuitka

    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Organize artifacts
        run: |
          mv win-pyinstaller/main.exe pjyn-win-x64.exe
          mv win-nuitka/main.exe pjyn-nuitka-win-x64.exe

      - name: Upload test packages
        uses: actions/upload-artifact@v7
        with:
          name: test-packages
          path: |
            pjyn-win-x64.exe
            pjyn-nuitka-win-x64.exe
            if-no-files-found: error